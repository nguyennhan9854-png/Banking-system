<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập – Hệ thống Ngân hàng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
      background: linear-gradient(160deg, #0A1A4F 0%, #0D2A78 55%, #1E5BD8 100%); }
    .login { width: 100%; max-width: 440px; text-align: center; padding: 36px 32px; }
    .login__logo { display: inline-flex; align-items: center; gap: 12px; color: var(--navy); font-weight: 700; font-size: 18px; text-align: left; line-height: 1.3; }
    .login__logo span { width: 52px; height: 52px; border-radius: 14px; background: var(--navy); display: inline-flex; align-items: center; justify-content: center; }
    .login__logo svg { width: 32px; height: 32px; }
    .login__art { width: 240px; margin: 18px auto 4px; }
    .login h1 { font-size: 24px; color: var(--navy); }
    .login p { color: var(--text-2); margin: 8px 0 22px; }
  </style>
</head>
<body>
  <main class="card login">
    <div class="login__logo"><span id="logo"></span>Hệ thống<br>Ngân hàng</div>
    <img class="login__art" src="assets/images/logout-door.png" alt="">
    <h1>Bạn đã đăng xuất</h1>
    <p>Phiên làm việc đã kết thúc an toàn. Đăng nhập lại để tiếp tục quản lý tài chính của bạn.</p>
    <a class="btn btn--primary btn--lg btn--block" href="index.html">Đăng nhập lại</a>
  </main>
  <script src="js/icons.js"></script>
  <script>document.getElementById("logo").innerHTML = App.logoSvg(32);</script>
</body>
</html>
