<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thống kê – Hệ thống Ngân hàng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Dancing+Script:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/statistics.css">
</head>
<body>
  <nav id="app-sidebar"></nav>

  <div class="app">
    <header id="app-header"></header>

    <main class="st-page" id="main">
      <!-- ===== BANNER ===== -->
      <section class="banner banner--compact" aria-labelledby="page-title">
        <div class="banner__scene" aria-hidden="true"></div>
        <div class="banner__text">
          <h1 class="banner__title" id="page-title">Thống kê</h1>
          <p class="banner__subtitle">Tiền vào, tiền ra và tiền lãi theo từng tháng, từng quý</p>
        </div>
        <div class="banner__slogan" aria-hidden="true">
          Hiểu dòng tiền<br>Chủ động tài chính
          <svg width="110" height="16" viewBox="0 0 110 16"><path d="M2 13C28 4 64 1 108 4" fill="none" stroke="#1E5BD8" stroke-width="2.5" stroke-linecap="round"/></svg>
        </div>
      </section>

      <!-- ===== BỘ LỌC ===== -->
      <section class="card st-filters" aria-label="Chọn kỳ thống kê">
        <div class="tabs st-presets" role="tablist" aria-label="Khoảng thời gian" data-st-presets>
          <button type="button" class="tab" role="tab" aria-selected="false" data-preset="month">Tháng này</button>
          <button type="button" class="tab" role="tab" aria-selected="false" data-preset="quarter">Quý này</button>
          <button type="button" class="tab is-active" role="tab" aria-selected="true" data-preset="6m">6 tháng gần nhất</button>
          <button type="button" class="tab" role="tab" aria-selected="false" data-preset="year">Năm nay</button>
          <button type="button" class="tab" role="tab" aria-selected="false" data-preset="custom">Tùy chọn</button>
        </div>
        <div class="st-filters__row">
          <div class="field">
            <label class="field__label" for="st-from">Từ ngày</label>
            <input id="st-from" class="input" type="date" data-st-from>
          </div>
          <div class="field">
            <label class="field__label" for="st-to">Đến ngày</label>
            <input id="st-to" class="input" type="date" data-st-to>
          </div>
          <div class="field">
            <label class="field__label" for="st-group">Gom theo</label>
            <select id="st-group" class="select" data-st-group>
              <option value="month">Theo tháng</option>
              <option value="quarter">Theo quý</option>
              <option value="day">Theo ngày</option>
            </select>
          </div>
          <div class="field">
            <label class="field__label" for="st-acc">Tài khoản</label>
            <select id="st-acc" class="select" data-st-acc></select>
          </div>
          <button type="button" class="btn btn--outline st-export" data-st-export><i data-ic="download" data-size="18"></i>Xuất CSV</button>
        </div>
        <p class="field-error" role="alert" data-st-error></p>
      </section>

      <!-- ===== TỔNG QUAN ===== -->
      <section class="st-stats" aria-label="Tổng quan kỳ thống kê" data-st-stats></section>

      <!-- ===== BIỂU ĐỒ ===== -->
      <section class="card" aria-labelledby="st-chart-title">
        <div class="card__head">
          <h2 class="card__title" id="st-chart-title"><i data-ic="chartBars" data-size="22"></i>Tiền vào – tiền ra theo kỳ</h2>
          <span class="st-range" data-st-range></span>
        </div>
        <div class="st-chart" data-st-chart></div>
        <div class="st-legend">
          <span><i style="background:#16A34A"></i>Tiền vào</span>
          <span><i style="background:#EF4444"></i>Tiền ra</span>
          <span><i style="background:#7C3AED"></i>Tiền lãi</span>
        </div>
      </section>

      <div class="st-bottom">
        <!-- ===== BẢNG THEO KỲ ===== -->
        <section class="card" aria-labelledby="st-periods-title">
          <div class="card__head">
            <h2 class="card__title" id="st-periods-title"><i data-ic="calendar" data-size="22"></i>Chi tiết từng kỳ</h2>
            <span class="st-check" data-st-check></span>
          </div>
          <div class="table-wrap" data-st-periods></div>
        </section>

        <!-- ===== THEO LOẠI GIAO DỊCH ===== -->
        <aside class="card st-types" aria-labelledby="st-types-title">
          <h2 class="card__title card__title--sm" id="st-types-title"><i data-ic="tag" data-size="20"></i>Theo loại giao dịch</h2>
          <ul class="st-types__list" data-st-types></ul>
        </aside>
      </div>

      <!-- ===== THEO TÀI KHOẢN ===== -->
      <section class="card" aria-labelledby="st-acc-title">
        <div class="card__head">
          <h2 class="card__title" id="st-acc-title"><i data-ic="wallet" data-size="22"></i>Theo từng tài khoản</h2>
        </div>
        <div class="table-wrap" data-st-accounts></div>
      </section>
    </main>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/money.js"></script>
  <script src="js/pages/statistics.js"></script>
</body>
</html>
